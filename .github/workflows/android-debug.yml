name: android-debug
# Builds the Android debug APK on request (Actions tab, "Run workflow"). It never runs by itself, so it costs nothing
# until it is started. It touches no AWS account: the app is built from this repository alone.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run mobile:sync
      - run: chmod +x apps/mobile/android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vayu-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
