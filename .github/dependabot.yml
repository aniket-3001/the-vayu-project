version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aws-cdk:
        patterns: ['aws-cdk*', 'constructs']
      aws-sdk:
        patterns: ['@aws-sdk/*']
      capacitor:
        patterns: ['@capacitor/*', '@capacitor-community/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
